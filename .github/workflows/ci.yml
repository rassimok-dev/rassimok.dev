name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Catches malformed markup and, importantly, missing accessibility
      # attributes that are easy to regress by hand.
      - name: Validate HTML
        run: npx --yes html-validate index.html klad/index.html

      # /klad/ ships a real simulation with a real test suite. Without this
      # step the game's logic would be the one part of the repo CI cannot see:
      # every other guard greps text or validates markup, so a collision or
      # key-counting regression that soft-locks a level would merge green.
      # Zero dependencies, and Node is already set up above.
      - name: Game tests
        run: node --test klad/test/

      # A broken link on a CV site is the cheapest possible bad impression.
      - name: Check links
        run: npx --yes linkinator . --recurse --skip "^https://github.com"

      # Enforces the privacy claim in the footer. If someone (or some AI)
      # ever pastes in a Google Font or an analytics snippet, this fails
      # rather than quietly making the page's promise untrue.
      #
      # www.w3.org is excluded deliberately: `xmlns="http://www.w3.org/2000/svg"`
      # is an XML namespace *identifier*, not a URL the browser ever fetches.
      # Excluding it keeps the check honest instead of training us to ignore it.
      - name: No third-party requests
        run: |
          hits=$(grep -rInE '(https?:)?//' \
                   --include='*.html' --include='*.css' --include='*.svg' . \
                 | grep -vE 'www\.w3\.org' \
                 | grep -vE 'rel="me noopener"' \
                 | grep -vE 'https://github\.com/' || true)

          # JavaScript is scanned separately and more precisely. A bare `//`
          # would match every line comment in every module, so match real
          # external references instead: an absolute scheme, or a
          # protocol-relative module specifier.
          jshits=$(grep -rInE "https?:|from[[:space:]]*['\"]//|import\([[:space:]]*['\"]//" \
                     --include='*.js' . || true)

          if [ -n "$hits$jshits" ]; then
            echo "$hits"
            echo "$jshits"
            echo "::error::Third-party reference found. This site must make zero external requests."
            exit 1
          fi
          echo "OK: no third-party references."

      # The apex ships no JavaScript. That is a design decision, so assert it.
      # /klad/ is the one deliberate exception and carries its own CSP, so it
      # is excluded here rather than the guard being deleted outright -- the
      # claim stays enforced on every page that actually makes it.
      - name: No JavaScript outside /klad/
        run: |
          hits=$(grep -rIn -E '<script|\.js"' --include='*.html' --exclude-dir=klad . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::JavaScript outside /klad/. Those pages are intentionally JS-free."
            exit 1
          fi
          echo "OK: no JavaScript."
